<!doctype html>
<!--
  TenderLens large-file upload widget. Plain HTML/JS, no build step, no external script or CDN - the
  Streamlit component bridge here is the raw postMessage protocol (documented by Streamlit, implemented by
  hand below as `st_*` helpers), since a static component doesn't get the npm-only streamlit-component-lib.

  What this does and does NOT do:
  - Lets several PDFs be added to one slot (up to max_files), each asking Python (via a rerun) for its own
    GCS resumable-upload session, then uploaded in chunks DIRECTLY to Cloud Storage - this file never sends
    any file's bytes to Streamlit/Cloud Run itself. Only small JSON messages (filename, size, content type,
    a session URL, a final object name) cross the Python/JS boundary, one file at a time.
  - Uploads one file at a time, in the order added (`active` below) - the rest sit queued. This isn't a
    bandwidth optimisation, it's a protocol constraint: a Streamlit component instance can only have one
    pending returned value in flight per rerun, so two files can't both be mid-handshake with Python at once.
  - Retries a dropped chunk with backoff, and can resume a session that was interrupted (a page reload
    loses every picked File's in-memory bytes, since browsers don't let JS keep file bytes across a reload -
    "resume" here means finishing the SAME upload after a network blip without restarting from byte 0, not
    resuming after the tab was closed - already-finished files stay listed, but a still-queued or
    interrupted one past that point needs to be removed and re-added).
  - Never decides pass/fail on its own: the real size/type check happens server-side in
    tenderlens/storage.py's finalize_upload(), after this widget reports a given file done. This file's own
    checks are UX only (an honest user finds out immediately, not after a 10-minute upload).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 4px 2px; font-size: 14px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid #8884; cursor: pointer;
          background: #6665; }
  button:disabled { opacity: .5; cursor: default; }
  button.danger { border-color: #c0392b88; }
  .bar-track { flex: 1 1 140px; min-width: 100px; height: 8px; border-radius: 4px; background: #8884;
              overflow: hidden; }
  .bar-fill { height: 100%; background: #2e7d32; width: 0%; transition: width .15s linear; }
  .bar-fill.error { background: #c0392b; }
  .meta { opacity: .75; font-size: 12px; }
  .error { color: #c0392b; font-size: 13px; }
  .ok { color: #2e7d32; font-size: 13px; }
  .status-text { min-width: 90px; }
  input[type=file] { display: none; }
  .file-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 4px 0;
             border-top: 1px solid #8882; }
  .file-name { flex: 1 1 160px; min-width: 120px; font-size: 13px; overflow-wrap: anywhere; }
</style>
</head>
<body>
  <div class="row">
    <button id="pick-btn" type="button">Add file(s)</button>
    <input id="file-input" type="file" accept="application/pdf,.pdf" multiple>
  </div>
  <div id="top-error" class="error"></div>
  <div id="file-list"></div>

<script>
'use strict';

// ---------------------------------------------------------------- Streamlit component bridge (hand-rolled)
// See Streamlit's own component protocol: https://docs.streamlit.io/develop/concepts/custom-components
// This widget never loads an external script - the whole bridge is ~20 lines of postMessage.

function st_send(type, extra) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type }, extra || {}), '*');
}
function st_ready() { st_send('streamlit:componentReady', { apiVersion: 1 }); }
function st_setHeight(h) { st_send('streamlit:setFrameHeight', { height: h }); }
// Every message to Python carries a fresh _seq: Streamlit keeps a component's last returned value alive
// across reruns until JS sends a new one, so without a nonce the Python side could not tell "the user just
// did something new" apart from "that's still the same old message from two reruns ago" - and would
// re-create a session (or re-finalize an upload) every single unrelated rerun.
let st_seq = 0;
function st_setValue(value) {
  st_send('streamlit:setComponentValue', { value: Object.assign({ _seq: ++st_seq }, value), dataType: 'json' });
}

let st_args = {};
window.addEventListener('message', (event) => {
  const d = event.data;
  if (!d || d.type !== 'streamlit:render') return;
  st_args = d.args || {};
  onRender(st_args);
});

// ------------------------------------------------------------------------------------- upload state machine
// Lifecycle per item: queued -> awaiting_session (Python is creating the GCS session) -> uploading ->
// (interrupted <-> uploading, via retry/resume) -> finalizing (Python verifies) -> done | interrupted(fatal).
// Only one item is ever active (awaiting_session/uploading/finalizing) at a time - see the file header.

const CHUNK_BYTES = 8 * 1024 * 1024;          // 8 MiB - Google's own recommended minimum chunk size
const MAX_CHUNK_RETRIES = 5;
const RETRY_BASE_MS = 1000;
const CHUNK_TIMEOUT_MS = 60000;               // a hung connection must not wait forever - see uploadChunked()
const SESSION_TIMEOUT_MS = 25000;             // see requestSession() - Python creating a session is one
                                              // synchronous Streamlit rerun with no timeout of its own here

let items = [];         // {id, file, name, size, status, error, fatal, sessionUrl, objectName, uploadedBytes}
let nextId = 1;
let active = null;      // the one item object currently owning the in-flight upload below, or null
let cancelled = false;  // guards the active item's own upload loop - reset whenever a new item becomes active
let abortCtrl = null;

const $ = (id) => document.getElementById(id);

function fmtBytes(n) {
  if (n >= 1_000_000_000) return (n / 1_000_000_000).toFixed(2) + ' GB';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + ' MB';
  if (n >= 1_000) return (n / 1_000).toFixed(0) + ' KB';
  return n + ' B';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function statusText(item) {
  switch (item.status) {
    case 'queued': return 'Queued';
    case 'awaiting_session': return 'Starting upload&hellip;';
    case 'uploading': return item.liveStatus || `${fmtBytes(item.uploadedBytes)} / ${fmtBytes(item.size)}`;
    case 'interrupted': return item.error || 'Interrupted';
    case 'finalizing': return 'Verifying&hellip;';
    case 'done': return `Uploaded (${fmtBytes(item.size)})`;
    default: return '';
  }
}

let topErrorText = '';
function setTopError(msg) {
  topErrorText = msg || '';
  $('top-error').textContent = topErrorText;
}

function render() {
  const rows = items.map((item) => {
    const pct = item.status === 'done' ? 100
              : item.size ? Math.max(0, Math.min(100, (item.uploadedBytes / item.size) * 100)) : 0;
    const isError = item.status === 'interrupted';
    const isOk = item.status === 'done';
    const canResume = item.status === 'interrupted' && !item.fatal && item.file;
    const canCancel = item.status === 'awaiting_session' || item.status === 'uploading'
                     || item.status === 'interrupted';
    const canRemove = item.status !== 'uploading' && item.status !== 'awaiting_session'
                     && item.status !== 'finalizing';
    return `<div class="file-row">
        <div class="file-name">${escapeHtml(item.name)} <span class="meta">(${fmtBytes(item.size)})</span></div>
        <div class="bar-track"><div class="bar-fill ${isError ? 'error' : ''}" style="width:${pct.toFixed(1)}%">
        </div></div>
        <span class="status-text ${isError ? 'error' : isOk ? 'ok' : 'meta'}">${statusText(item)}</span>
        ${canResume ? `<button data-id="${item.id}" data-act="resume">Resume</button>` : ''}
        ${canCancel ? `<button data-id="${item.id}" data-act="cancel" class="danger">Cancel</button>` : ''}
        ${canRemove ? `<button data-id="${item.id}" data-act="remove" class="danger">Remove</button>` : ''}
      </div>`;
  }).join('');
  $('file-list').innerHTML = rows;
  const maxFiles = st_args.max_files || 10;
  $('pick-btn').disabled = items.length >= maxFiles;
  st_setHeight(48 + items.length * 40 + (topErrorText ? 20 : 0));
}

// ------------------------------------------------------------------------------------------- file selection

$('pick-btn').addEventListener('click', () => $('file-input').click());

$('file-input').addEventListener('change', () => {
  const picked = Array.from($('file-input').files);
  $('file-input').value = '';  // lets the same filename be picked again later (e.g. after Remove)
  if (!picked.length) return;
  const maxBytes = st_args.max_bytes || 0;
  const maxFiles = st_args.max_files || 10;
  let err = '';
  for (const f of picked) {
    // Client-side checks are UX only, never the real boundary - see the file header comment and
    // tenderlens/storage.py's module docstring. The server re-checks both after each upload finishes.
    if (items.length >= maxFiles) { err = `At most ${maxFiles} files in this slot.`; break; }
    if (f.type && f.type !== 'application/pdf' && !f.name.toLowerCase().endsWith('.pdf')) {
      err = `${f.name}: not a PDF.`; continue;
    }
    if (maxBytes && f.size > maxBytes) {
      err = `${f.name}: ${fmtBytes(f.size)} is over the ${fmtBytes(maxBytes)} limit.`; continue;
    }
    items.push({ id: String(nextId++), file: f, name: f.name, size: f.size, status: 'queued', error: null,
                fatal: false, sessionUrl: null, objectName: null, uploadedBytes: 0 });
  }
  setTopError(err);
  render();
  maybeStartNext();
});

function maybeStartNext() {
  if (active) return;
  const next = items.find((it) => it.status === 'queued');
  if (!next) return;
  active = next;
  cancelled = false;
  requestSession(next);
}

function finishActive(item) {
  if (active === item) active = null;
  render();
  maybeStartNext();
}

function requestSession(item) {
  item.status = 'awaiting_session';
  item.error = null;
  render();
  clearTimeout(item.sessionWatchdog);
  item.sessionWatchdog = setTimeout(() => {
    if (active === item && item.status === 'awaiting_session') {
      interrupted(item, 'Starting the upload is taking unusually long. Press Resume to try again.');
    }
  }, SESSION_TIMEOUT_MS);
  st_setValue({ action: 'request_session', file_id: item.id, kind: st_args.kind, filename: item.name,
               size: item.size, content_type: 'application/pdf' });
}

// --------------------------------------------------------------------------------------------- row actions

$('file-list').addEventListener('click', (event) => {
  const btn = event.target.closest('button[data-act]');
  if (!btn) return;
  const item = items.find((it) => it.id === btn.dataset.id);
  if (!item) return;
  if (btn.dataset.act === 'resume') doResume(item);
  else if (btn.dataset.act === 'cancel') doCancel(item);
  else if (btn.dataset.act === 'remove') doRemove(item);
});

function doCancel(item) {
  if (active === item) {
    cancelled = true;
    clearTimeout(item.sessionWatchdog);
    if (abortCtrl) abortCtrl.abort();
  }
  doRemove(item);
}

function doRemove(item) {
  items = items.filter((it) => it !== item);
  const wasActive = active === item;
  if (wasActive) active = null;
  render();
  // Harmless even if Python never saw this file_id yet (still queued, no session requested) - see
  // upload_component.py's _handle_remove(), which no-ops on an unknown id.
  st_setValue({ action: 'remove', file_id: item.id, kind: st_args.kind });
  if (wasActive) maybeStartNext();
}

function doResume(item) {
  if (!item.file) return;  // the page was reloaded - the browser no longer has this file's bytes
  active = item;
  cancelled = false;
  if (!item.sessionUrl) {
    requestSession(item);  // interrupted before Python ever returned a session - ask again from scratch
    return;
  }
  item.status = 'uploading';
  item.error = null;
  render();
  runUpload(item);
}

// --------------------------------------------------------------------------------------- render from Python

function onRender(args) {
  for (const f of (args.files || [])) {
    const item = items.find((it) => it.id === f.file_id);
    if (!item) continue;  // removed locally since this message was sent - nothing to reconcile
    if (f.error) {
      if (active === item) clearTimeout(item.sessionWatchdog);
      interrupted(item, f.error);
      continue;
    }
    if (f.verified) {
      if (active === item) clearTimeout(item.sessionWatchdog);
      item.status = 'done';
      item.size = f.verified.size;
      item.error = null;
      item.file = null;  // bytes no longer needed - lets a large File be garbage-collected
      finishActive(item);
      continue;
    }
    if (item.status === 'awaiting_session' && f.session_url && active === item) {
      clearTimeout(item.sessionWatchdog);
      item.sessionUrl = f.session_url;
      item.objectName = f.object_name;
      item.status = 'uploading';
      render();
      runUpload(item);
    }
  }
}

// Never call uploadChunked() directly: an async function called without awaiting it fails silently on
// any unexpected exception (not a clean HTTP error, which uploadChunked already handles itself) - the
// promise just rejects with nobody listening, and the UI is left stuck on "Uploading…" forever, looking
// frozen with no way out but a page reload. This wrapper is the one thing standing between any such bug
// and a visible, actionable error with a Resume button.
function runUpload(item) {
  uploadChunked(item).catch((err) => {
    interrupted(item, `Something went wrong during the upload (${err && err.message ? err.message : err}). `
               + 'Press Resume to try again.');
  });
}

// ------------------------------------------------------------------------------------------ chunked upload

// Ask GCS what it actually has, rather than trusting our own locally-tracked offset - this is the
// official way to resume per Google's resumable-upload docs (a status-check PUT: no body, Content-Range:
// bytes */total), and it's what actually fixes a failure mode a real browser hit repeatedly: our offset
// drifted from GCS's own confirmed byte count (most likely because res.headers.get('Range') on a 308 came
// back null under real CORS enforcement, even though it reads fine when checked outside a browser - see
// the Content-Range comment below), so every later chunk's declared range no longer matched what GCS
// expected, GCS rejected every one of them, and - because an error response doesn't reliably carry CORS
// headers either - the browser reported each rejection as a plain, status-less "CORS error", with no way
// for blind retries (resending the same now-wrong range) to ever recover. Returns the confirmed byte
// count, or null if the check itself failed (caller falls back to its current guess).
async function queryUploadStatus(item) {
  const ctrl = new AbortController();
  const timeoutId = setTimeout(() => ctrl.abort(), 15000);  // a bare status check should be fast
  try {
    const res = await fetch(item.sessionUrl, {
      method: 'PUT',
      headers: { 'Content-Range': `bytes */${item.size}` },
      signal: ctrl.signal,
    });
    if (res.status === 308) {
      const range = res.headers.get('Range');
      return range ? parseInt(range.split('-')[1], 10) + 1 : 0;
    }
    if (res.status === 200 || res.status === 201) return item.size;
  } catch (err) { /* status check itself failed or timed out - fall through to null */
  } finally {
    clearTimeout(timeoutId);
  }
  return null;
}

async function uploadChunked(item) {
  // A real freeze was traced to this: with no per-chunk timeout, a connection that stalls (goes quiet
  // mid-request - not a clean drop) never makes fetch() resolve OR reject, so nothing here ever ran: not
  // the success path, not the catch block, not even runUpload()'s own .catch() wrapper - the promise just
  // never settled. abortCtrl is now a fresh AbortController per chunk (not once for the whole upload), with
  // a timer that aborts it if nothing comes back in time, turning a silent hang into the same retry/backoff
  // path a clean network error already takes.
  let offset = item.uploadedBytes;
  let retries = 0;

  async function retryOrGiveUp(giveUpMessage) {
    // Shared by both failure paths below. Re-syncing via queryUploadStatus() before every retry (not just
    // after giving up) is what actually prevents the permanent-CORS-error loop described above.
    retries += 1;
    if (cancelled) return false;
    if (retries > MAX_CHUNK_RETRIES) {
      interrupted(item, giveUpMessage);
      return false;
    }
    item.liveStatus = `Resyncing&hellip; (${retries}/${MAX_CHUNK_RETRIES})`;
    render();
    const confirmed = await queryUploadStatus(item);
    if (confirmed !== null) {
      offset = confirmed;
      item.uploadedBytes = confirmed;
      render();
    }
    item.liveStatus = `Retrying&hellip; (${retries}/${MAX_CHUNK_RETRIES})`;
    render();
    await sleep(RETRY_BASE_MS * Math.pow(2, retries - 1));
    item.liveStatus = null;
    render();
    return true;
  }

  while (offset < item.size && !cancelled) {
    const end = Math.min(offset + CHUNK_BYTES, item.size);
    const chunk = item.file.slice(offset, end);
    abortCtrl = new AbortController();
    const timeoutId = setTimeout(() => abortCtrl.abort(), CHUNK_TIMEOUT_MS);
    let res;
    try {
      res = await fetch(item.sessionUrl, {
        method: 'PUT',
        headers: {
          // Content-Length is NOT set here on purpose: it's a forbidden header name per the Fetch spec -
          // browsers silently refuse to let JS set it and compute it themselves from the body, every time,
          // in every browser. Setting it anyway (as this code used to) didn't throw - it just meant the
          // ACTUAL request GCS received didn't match what was likely negotiated, which was the first of
          // two compounding bugs here - see queryUploadStatus() above for the second.
          'Content-Range': `bytes ${offset}-${end - 1}/${item.size}`,
        },
        body: chunk,
        signal: abortCtrl.signal,
      });
    } catch (err) {
      clearTimeout(timeoutId);
      if (cancelled) return;
      const timedOut = err && err.name === 'AbortError';
      // A real, documented GCS limitation, confirmed against the live bucket: the response that actually
      // COMPLETES a resumable upload carries no CORS headers at all (only the 308 "keep going" responses
      // do), so fetch() reports a perfectly successful upload as an opaque CORS failure - there is no way
      // for this code to tell that apart from a genuine failure using the exception alone, and retrying
      // would just resend bytes GCS already has (which it may then reject outright, since the session is
      // already finalized). Rather than guess, ask Python's finalize_upload() - it checks the object's
      // real size and bytes in GCS, which is the actual source of truth this whole design relies on either
      // way. If the chunk genuinely never landed, that check fails and reports a normal, resumable error.
      if (!timedOut && end === item.size) {
        item.uploadedBytes = item.size;
        item.status = 'finalizing';
        render();
        st_setValue({ action: 'upload_complete', file_id: item.id, kind: st_args.kind,
                     object_name: item.objectName });
        return;
      }
      const ok = await retryOrGiveUp(timedOut
        ? 'The upload stalled and timed out. Check your network and press Resume.'
        : 'The connection dropped repeatedly. Check your network and press Resume.');
      if (!ok) return;
      continue;
    }
    clearTimeout(timeoutId);

    if (res.status === 308) {
      // chunk accepted (maybe partially) - the Range header says how much GCS actually has so far;
      // trust that over what we think we sent, per Google's own resumable-upload guidance. If the header
      // isn't visible here (see queryUploadStatus()'s comment), this falls back to our own count, same as
      // before - the difference now is that a wrong guess gets corrected by the NEXT retry's status
      // check, instead of compounding into a permanent failure.
      const range = res.headers.get('Range');            // e.g. "bytes=0-8388607"
      offset = range ? parseInt(range.split('-')[1], 10) + 1 : end;
      item.uploadedBytes = offset;
      retries = 0;
      render();
      continue;
    }
    if (res.status === 200 || res.status === 201) {
      item.uploadedBytes = item.size;
      item.status = 'finalizing';
      render();
      st_setValue({ action: 'upload_complete', file_id: item.id, kind: st_args.kind,
                   object_name: item.objectName });
      return;
    }
    if (res.status === 499 || res.status === 404) {
      // session cancelled or expired (sessions last 7 days, but can be invalidated server-side)
      interrupted(item, 'This upload session is no longer valid. Remove and re-add this file.', true);
      return;
    }
    // any other status: resync and retry, same as a network drop
    const ok = await retryOrGiveUp(`Upload stalled (server said HTTP ${res.status}). Press Resume to try again.`);
    if (!ok) return;
  }
}

function interrupted(item, message, fatal) {
  // Deliberately does NOT advance the queue (unlike finishActive()) - an interrupted upload still occupies
  // `active` until the user explicitly Resumes it or Removes/Cancels it, same as the old single-file
  // widget: silently skipping ahead to the next file would bury a failure the user needs to act on.
  item.status = 'interrupted';
  item.error = message;
  item.fatal = !!fatal;
  item.liveStatus = null;
  render();
}

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

// Last-resort safety net: runUpload() already catches uploadChunked()'s own promise, but if some other
// bug anywhere in this file throws inside an async context, the default browser behaviour is to log it to
// the console and do nothing visible - the exact "silently frozen, no way out but a reload" failure mode
// this widget must never have. If an upload is in flight when that happens, surface it the same way a
// real upload error would be, instead of leaving the page stuck.
window.addEventListener('unhandledrejection', (event) => {
  if (active && (active.status === 'uploading' || active.status === 'awaiting_session')) {
    interrupted(active, `Unexpected error (${event.reason && event.reason.message ? event.reason.message : event.reason}). `
               + 'Press Resume to try again.');
  }
});

// ------------------------------------------------------------------------------------------------- startup

render();
st_ready();
</script>
</body>
</html>
